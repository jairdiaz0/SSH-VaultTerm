# Static analysis for the whole workspace.
#
# The goal is a strict baseline that stays green: every rule enabled here must
# pass on `flutter analyze`, otherwise it gets fixed instead of disabled.
include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    # No implicit dynamic casts: a wrong type must fail at analysis time.
    strict-casts: true
    # No implicit `dynamic` in inferred types, e.g. empty collections.
    strict-inference: true
    # `List` without a type argument is an error, not a convention.
    strict-raw-types: true
  exclude:
    - build/**
    - android/**
    - windows/**
    - macos/**
    - linux/**
    # gen-l10n output is generated, kept under the analyzer by `dart format` only.
  errors:
    # A forgotten `await` is a bug in a client that owns sockets and databases.
    unawaited_futures: error
    # Printing secrets to stdout would bypass the redacting logger.
    avoid_print: error

linter:
  rules:
    - always_declare_return_types
    - avoid_dynamic_calls
    - avoid_print
    - directives_ordering
    - prefer_single_quotes
    - unawaited_futures
